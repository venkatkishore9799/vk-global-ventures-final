<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Make a Payment - VK Global</title>

    <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .payment-box {
            max-width: 500px;
            margin: 60px auto;
            background: white;
            padding: 35px;
            border-radius: 12px;
            box-shadow: 0 5px 25px rgba(0,0,0,0.12);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 18px;
            margin-bottom: 7px;
            font-weight: bold;
        }

        input {
            width: 100%;
            box-sizing: border-box;
            padding: 13px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 16px;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 15px;
            background: #111827;
            color: white;
            border: none;
            border-radius: 6px;
            font-size: 17px;
            cursor: pointer;
        }

        button:hover {
            opacity: 0.9;
        }

        #message {
            text-align: center;
            margin-top: 20px;
        }
    </style>
</head>

<body>

<div class="payment-box">

    <h1>Make a Payment</h1>

    <div class="subtitle">
        VK Global Ventures Pvt. Ltd.
    </div>

    <form id="paymentForm">

        <label>Full Name</label>
        <input type="text" id="name" required>

        <label>Email Address</label>
        <input type="email" id="email" required>

        <label>Mobile Number</label>
        <input type="tel" id="phone" required>

        <label>Payment Amount (₹)</label>
        <input type="number" id="amount" min="1" step="0.01" placeholder="Enter amount" required>

        <button type="submit">
            Make Payment
        </button>

    </form>

    <div id="message"></div>

</div>

<script>
document.getElementById("paymentForm").addEventListener("submit", async function(e) {

    e.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const phone = document.getElementById("phone").value;
    const amount = document.getElementById("amount").value;

    document.getElementById("message").innerText = "Please wait...";

    try {

        const response = await fetch("/api/create-order", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name: name,
                email: email,
                phone: phone,
                amount: amount
            })
        });

        const order = await response.json();

        if (!response.ok) {
            throw new Error(order.error || "Unable to create payment order");
        }

        const options = {
            key: order.key_id,
            amount: order.amount,
            currency: "INR",
            name: "VK Global Ventures Pvt. Ltd.",
            description: "Payment",
            order_id: order.order_id,

            prefill: {
                name: name,
                email: email,
                contact: phone
            },

            handler: function(response) {

                document.getElementById("message").innerText =
                    "Payment completed. Verifying payment...";
                
                console.log(response);
            },

            theme: {
                color: "#111827"
            }
        };

        const razorpay = new Razorpay(options);

        razorpay.on("payment.failed", function(response) {
            document.getElementById("message").innerText =
                "Payment failed. Please try again.";
            console.log(response.error);
        });

        razorpay.open();

    } catch (error) {

        document.getElementById("message").innerText =
            error.message;

    }

});
</script>

</body>
</html>
